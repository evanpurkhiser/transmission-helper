name: build
on: [push]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4.2.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test

  build:
    name: build
    needs: test

    permissions:
      packages: write

    uses: evanpurkhiser/workflows/.github/workflows/docker.yml@main # zizmor: ignore[unpinned-uses]
    with:
      publish: ${{ github.ref == 'refs/heads/main' }}
